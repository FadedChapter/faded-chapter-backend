name: Deploy to Production

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

env:
  CI: true
  NODE_ENV: production
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-check:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: faded_chapter_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/faded_chapter_test

      - name: Build production bundle
        run: npm run build

      - name: Run security audit
        run: npm audit --production --audit-level=moderate
        continue-on-error: true

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: deploy-check
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate changelog
        id: changelog
        run: |
          echo "commit_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "commit_message=$(git log -1 --pretty=%B)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          body: |
            Production deployment of commit ${{ steps.changelog.outputs.commit_hash }}

            ${{ steps.changelog.outputs.commit_message }}
          draft: false
          prerelease: false

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: create-release
    if: success()

    steps:
      - name: Deployment notification
        run: |
          echo "✅ Backend deployed successfully"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: deploy-check
    if: failure()

    steps:
      - name: Deployment failure notification
        run: |
          echo "❌ Deployment checks failed"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
          exit 1

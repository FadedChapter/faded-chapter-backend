name: Load Testing

on:
  schedule:
    # Weekly load tests on Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of load test to run'
        required: true
        default: 'all'
        type: choice
        options:
          - dashboard
          - orders
          - stress
          - all

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  setup-test-env:
    name: Setup Test Environment
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: faded_chapter_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    outputs:
      api_url: ${{ steps.start-server.outputs.api_url }}
      server_pid: ${{ steps.start-server.outputs.pid }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Start server
        id: start-server
        run: |
          timeout 30 npm start &
          sleep 5
          echo "api_url=http://localhost:3000/api/v1" >> $GITHUB_OUTPUT
          echo "pid=$!" >> $GITHUB_OUTPUT

  load-test-dashboard:
    name: Load Test - Dashboard
    runs-on: ubuntu-latest
    needs: setup-test-env
    timeout-minutes: 20
    if: ${{ github.event.inputs.test_type == 'dashboard' || github.event.inputs.test_type == 'all' || github.event_name == 'schedule' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run dashboard load tests
        run: npm run load-test:dashboard
        env:
          API_BASE_URL: ${{ needs.setup-test-env.outputs.api_url }}
        continue-on-error: true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-load-test-results
          path: results/
          if-no-files-found: ignore
          retention-days: 30

  load-test-orders:
    name: Load Test - Orders
    runs-on: ubuntu-latest
    needs: setup-test-env
    timeout-minutes: 20
    if: ${{ github.event.inputs.test_type == 'orders' || github.event.inputs.test_type == 'all' || github.event_name == 'schedule' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run orders load tests
        run: npm run load-test:orders
        env:
          API_BASE_URL: ${{ needs.setup-test-env.outputs.api_url }}
        continue-on-error: true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orders-load-test-results
          path: results/
          if-no-files-found: ignore
          retention-days: 30

  stress-test:
    name: Stress Test
    runs-on: ubuntu-latest
    needs: setup-test-env
    timeout-minutes: 30
    if: ${{ github.event.inputs.test_type == 'stress' || github.event.inputs.test_type == 'all' || github.event_name == 'schedule' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run stress tests
        run: npm run load-test:stress
        env:
          API_BASE_URL: ${{ needs.setup-test-env.outputs.api_url }}
        continue-on-error: true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results
          path: results/
          if-no-files-found: ignore
          retention-days: 30

  performance-summary:
    name: Performance Summary
    runs-on: ubuntu-latest
    needs: [load-test-dashboard, load-test-orders, stress-test]
    if: always()

    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: all-results/

      - name: Generate summary
        run: |
          echo "## Load Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Load tests completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Test artifacts available for download" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📊 Load tests completed. Check artifacts for detailed results.'
            })

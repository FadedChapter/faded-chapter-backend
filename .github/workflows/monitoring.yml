name: Monitoring & Health Checks

on:
  schedule:
    # Check health every hour
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/core/monitoring/**'
      - '.github/workflows/monitoring.yml'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  health-check:
    name: Health Check Endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: faded_chapter_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Start server
        run: |
          timeout 30 npm start &
          sleep 5
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/faded_chapter_test

      - name: Test liveness endpoint
        run: |
          RESPONSE=$(curl -s http://localhost:3000/health/live)
          echo "Liveness: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"alive"' || exit 1

      - name: Test readiness endpoint
        run: |
          RESPONSE=$(curl -s http://localhost:3000/health/ready)
          echo "Readiness: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"healthy"' || exit 1

      - name: Test metrics endpoint
        run: |
          METRICS=$(curl -s http://localhost:3000/metrics)
          echo "Metrics available: $(echo "$METRICS" | wc -l) lines"
          echo "$METRICS" | grep -q 'http_requests_total' || exit 1

      - name: Test detailed health
        run: |
          HEALTH=$(curl -s http://localhost:3000/health/detailed)
          echo "Detailed Health: $HEALTH"
          echo "$HEALTH" | grep -q '"status"' || exit 1

      - name: Verify key metrics present
        run: |
          METRICS=$(curl -s http://localhost:3000/metrics)
          echo "Checking for required metrics..."
          echo "$METRICS" | grep -q 'http_request_duration_seconds' && echo "✓ HTTP duration" || (echo "✗ HTTP duration"; exit 1)
          echo "$METRICS" | grep -q 'db_query_duration_seconds' && echo "✓ DB query duration" || (echo "✗ DB query duration"; exit 1)
          echo "$METRICS" | grep -q 'process_resident_memory_bytes' && echo "✓ Memory metrics" || (echo "✗ Memory metrics"; exit 1)
          echo "$METRICS" | grep -q 'app_uptime_seconds' && echo "✓ Uptime metrics" || (echo "✗ Uptime metrics"; exit 1)

  monitoring-setup:
    name: Monitoring Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          docker-compose -f docker-compose.monitoring.yml config > /dev/null
          echo "✓ Docker Compose configuration valid"

      - name: Verify monitoring files
        run: |
          echo "Checking monitoring configuration files..."
          test -f monitoring/prometheus.yml && echo "✓ prometheus.yml" || (echo "✗ prometheus.yml"; exit 1)
          test -f monitoring/alert_rules.yml && echo "✓ alert_rules.yml" || (echo "✗ alert_rules.yml"; exit 1)
          test -f monitoring/alertmanager.yml && echo "✓ alertmanager.yml" || (echo "✗ alertmanager.yml"; exit 1)
          test -f monitoring/grafana/provisioning/datasources/prometheus.yml && echo "✓ Grafana datasource" || (echo "✗ Grafana datasource"; exit 1)
          test -f monitoring/grafana/dashboards/api-performance.json && echo "✓ API performance dashboard" || (echo "✗ API performance dashboard"; exit 1)

      - name: Validate Prometheus configuration
        run: |
          pip install yamllint
          yamllint -d relaxed monitoring/prometheus.yml
          yamllint -d relaxed monitoring/alert_rules.yml
          yamllint -d relaxed monitoring/alertmanager.yml

  sentry-check:
    name: Sentry Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Sentry integration
        run: |
          echo "Checking Sentry integration..."
          grep -r "@sentry/node" src/ && echo "✓ Sentry imported" || echo "⚠ Sentry not imported in source"
          grep -r "initializeSentry" src/ && echo "✓ Sentry initialization" || echo "⚠ Sentry initialization not found"
          test -f src/core/monitoring/sentry.ts && echo "✓ Sentry module present" || (echo "✗ Sentry module missing"; exit 1)

  create-report:
    name: Create Monitoring Report
    runs-on: ubuntu-latest
    needs: [health-check, monitoring-setup]
    if: always()

    steps:
      - name: Generate monitoring report
        run: |
          echo "## Monitoring Status Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Health endpoints: Verified" >> $GITHUB_STEP_SUMMARY
          echo "✅ Prometheus metrics: Verified" >> $GITHUB_STEP_SUMMARY
          echo "✅ Docker Compose: Valid" >> $GITHUB_STEP_SUMMARY
          echo "✅ Alert rules: Configured" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Access Points" >> $GITHUB_STEP_SUMMARY
          echo "- Health check: `/health` (ready), `/health/live` (liveness)" >> $GITHUB_STEP_SUMMARY
          echo "- Metrics: `/metrics` (Prometheus format)" >> $GITHUB_STEP_SUMMARY
          echo "- Grafana: http://localhost:3001" >> $GITHUB_STEP_SUMMARY
          echo "- Prometheus: http://localhost:9090" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📊 Monitoring integration verified. Health endpoints and metrics are operational.'
            })
